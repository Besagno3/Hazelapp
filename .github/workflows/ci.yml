# Hazel Quest CI: runs the same checks a contributor runs locally
# (see hazel-game/README.md) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hazel-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hazel-game/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  edge-function:
    name: Type-check edge function
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hazel-game/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --no-config / --node-modules-dir=none: resolve npm: imports the way the
      # Supabase runtime does, not through the app's package.json.
      - run: deno check --no-config --node-modules-dir=none generate-questions/index.ts

  migrations:
    name: Apply migrations + SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: hazel-game/supabase
    steps:
      - uses: actions/checkout@v4
      - name: Apply the Supabase stub and every migration in order
        run: |
          psql -v ON_ERROR_STOP=1 -q -f ci/supabase-stub.sql
          for f in migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: SQL tests
        run: |
          for f in ci/*.test.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
